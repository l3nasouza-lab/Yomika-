<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Yomika - Scan Manga</title>
</head>
<body>

    <!-- Barre de navigation -->
    <header>
        <a href="index.html" class="logo">YOMIKA</a>
        <nav>
            <a href="index.html">Accueil</a>
            <a href="mangas.html">Catalogue</a>
        </nav>
    </header>

    <div class="container">
        
        <!-- SECTION RECOMMANDATIONS -->
        <div class="section-title">
            <h2>🔥 Recommandations</h2>
            <span class="badge-rec">POPULAIRE</span>
        </div>

        <div class="manga-grid">
            <div class="manga-card">
                <img src="https://via.placeholder.com/150x200/ff4757/ffffff?text=Manga+1" alt="Couverture">
                <div class="manga-info">
                    <p class="manga-title">Solo Leveling</p>
                    <p class="manga-chapter">Chapitre 179</p>
                </div>
            </div>

            <div class="manga-card">
                <img src="https://via.placeholder.com/150x200/2ed573/ffffff?text=Manga+2" alt="Couverture">
                <div class="manga-info">
                    <p class="manga-title">Jujutsu Kaisen</p>
                    <p class="manga-chapter">Chapitre 250</p>
                </div>
            </div>
        </div>

        <!-- SECTION DERNIÈRES SORTIES -->
        <div class="section-title">
            <h2>⏱️ Dernières Sorties</h2>
        </div>

        <div class="manga-grid">
            <div class="manga-card">
                <img src="https://via.placeholder.com/150x200/1e90ff/ffffff?text=Manga+3" alt="Couverture">
                <div class="manga-info">
                    <p class="manga-title">One Piece</p>
                    <p class="manga-chapter">Chapitre 1110</p>
                </div>
            </div>

            <div class="manga-card">
                <img src="https://via.placeholder.com/150x200/ffa502/ffffff?text=Manga+4" alt="Couverture">
                <div class="manga-info">
                    <p class="manga-title">Chainsaw Man</p>
                    <p class="manga-chapter">Chapitre 155</p>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
